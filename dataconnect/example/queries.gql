mutation InsertAssignment($data: Assignment_Data!) @auth(level: USER) {
  assignment_insert(data: $data)
}

mutation UpsertAssignment($data: Assignment_Data!) @auth(level: USER) {
  assignment_upsert(data: $data)
}

mutation UpdateAssignment($id: UUID!, $data: Assignment_Data!) @auth(level: USER) {
  assignment_update(id: $id, data: $data)
}

mutation DeleteAssignment($id: UUID!) @auth(level: USER) {
  assignment_delete(id: $id)
}

query GetAssignment($id: UUID!) @auth(level: USER) {
  assignment(id: $id) {
    id
    roleOnProject
    weeklyHoursAllocated
  }
}

query ListAssignments @auth(level: USER) {
  assignments {
    id
    roleOnProject
    weeklyHoursAllocated
  }
}

